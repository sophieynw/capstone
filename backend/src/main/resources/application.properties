spring.application.name=restfulhousekeeping
spring.profiles.default=h2
server.port=${PORT:50000}

calendar.import.fixed-delay=PT5M
calendar.import.initial-delay=PT1M

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

# For Testing
spring.mail.host=localhost
spring.mail.port=1025
# For Production
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=noreply@restfulhousekeeping.com
#spring.mail.password=app-password-goes-here

# Flip these to true when in production
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.debug=true

#uncomment for docker deployment
#server.port=${PORT:50000}

# Demo data is enabled by the local H2 profile only. Set this explicitly for
# another profile if a temporary demo deployment needs the sample accounts.
app.bootstrap.enabled=false
